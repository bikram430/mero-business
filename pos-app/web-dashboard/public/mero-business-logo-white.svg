<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 252 70" fill="none">
  <defs>
    <linearGradient id="barG" x1="0" y1="0" x2="0" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- M-peak bars -->
  <rect x="0"  y="42" width="11" height="28" rx="5.5" fill="url(#barG)" opacity="0.50"/>
  <rect x="15" y="26" width="11" height="44" rx="5.5" fill="url(#barG)" opacity="0.72"/>
  <rect x="30" y="4"  width="11" height="66" rx="5.5" fill="url(#barG)" filter="url(#glow)"/>
  <rect x="45" y="26" width="11" height="44" rx="5.5" fill="url(#barG)" opacity="0.72"/>
  <rect x="60" y="42" width="11" height="28" rx="5.5" fill="url(#barG)" opacity="0.50"/>

  <!-- White wordmark -->
  <text x="82" y="42"
    font-family="system-ui,-apple-system,'Segoe UI',Helvetica,sans-serif"
    font-size="31" font-weight="800" fill="#FFFFFF" letter-spacing="-1.2">mero</text>
  <text x="83" y="61"
    font-family="system-ui,-apple-system,'Segoe UI',Helvetica,sans-serif"
    font-size="12.5" font-weight="500" fill="rgba(255,255,255,0.6)" letter-spacing="4.5">BUSINESS</text>
</svg>
